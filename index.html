<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Miembros - Academias Científicas</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* Sistema de Pestañas (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Formularios y Estilos Comunes */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"], input[type="email"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.13);
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button.btn-submit:hover {
            background-color: #172554;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #6b7280;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background-color: #e5e7eb;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* Cuadros de Resultado y Alertas */
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--success-color);
            background-color: #f0fdf4;
            display: none;
        }

        .result-box.error {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }

        .result-box h3 {
            margin-top: 0;
            color: #111827;
        }

        .status-message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--success-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal de Acreditación Científica</h1>

    <div class="tabs">
        <button id="btn-user-tab" class="tab-btn active" onclick="switchTab('user-view')">Consulta de Miembros</button>
        <button id="btn-admin-tab" class="tab-btn" onclick="switchTab('admin-view')">Panel Administrador</button>
    </div>

    <div id="user-view" class="tab-content active">
        <div class="form-group">
            <label for="search-rut">Ingrese RUT del miembro (con puntos y guión, ej: 12.345.678-9):</label>
            <input type="text" id="search-rut" placeholder="12.345.678-9" oninput="formatSearchRut(this)">
        </div>
        <button class="btn-submit" onclick="buscarMiembro()">Verificar Pertenencia</button>

        <div id="search-result" class="result-box"></div>
    </div>

    <div id="admin-view" class="tab-content">
        <h3>Carga Masiva vía Excel (.xlsx)</h3>
        <p style="font-size: 13px; color: #6b7280; margin-top: -10px;">
            El archivo debe contener las columnas exactas: <strong>nombre completo</strong>, <strong>rut</strong>, <strong>correo</strong> y <strong>academia</strong>.
        </p>
        <div class="form-group">
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>
        <button class="btn-submit" onclick="cargarExcel()">Procesar Excel</button>
        <div id="admin-status" class="status-message"></div>

        <div class="divider">ó ingreso manual</div>

        <h3>Carga Manual de Miembro</h3>
        <div class="form-group">
            <label for="manual-nombre">Nombre Completo:</label>
            <input type="text" id="manual-nombre" placeholder="Juan Pérez Rossi">
        </div>
        <div class="form-group">
            <label for="manual-rut">RUT (con puntos y guión):</label>
            <input type="text" id="manual-rut" placeholder="12.345.678-9" oninput="formatManualRut(this)">
        </div>
        <div class="form-group">
            <label for="manual-correo">Correo Electrónico:</label>
            <input type="email" id="manual-correo" placeholder="ejemplo@correo.com">
        </div>
        <div class="form-group">
            <label for="manual-academia">Academia correspondiente:</label>
            <select id="manual-academia">
                <option value="">Seleccione una opción</option>
                <option value="ACEM UCM">ACEM UCM</option>
                <option value="ACEM UAT">ACEM UAT</option>
                <option value="ACEM UTAL">ACEM UTAL</option>
            </select>
        </div>
        <button class="btn-submit" onclick="guardarMiembroManual()">Guardar Miembro</button>
    </div>
</div>

<script>
    // Inicializar base de datos simulada en LocalStorage si no existe
    if (!localStorage.getItem('miembrosAcademia')) {
        localStorage.setItem('miembrosAcademia', JSON.stringify([]));
    }

    // Cambiar entre pestañas de manera fluida y protegida por contraseña
    function switchTab(tabId) {
        if (tabId === 'admin-view') {
            const contrasena = prompt("Ingrese la contraseña de administrador para continuar:");
            
            if (contrasena !== "AcemTalca2026") {
                alert("Contraseña incorrecta. Acceso denegado.");
                return;
            }
        }

        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        
        if (tabId === 'user-view') {
            document.getElementById('btn-user-tab').classList.add('active');
        } else if (tabId === 'admin-view') {
            document.getElementById('btn-admin-tab').classList.add('active');
        }
        
        document.getElementById('search-result').style.display = 'none';
        document.getElementById('admin-status').innerText = '';
    }

    function formatSearchRut(input) { formatRutField(input); }
    function formatManualRut(input) { formatRutField(input); }

    function formatRutField(input) {
        let value = input.value.replace(/\./g, '').replace(/-/g, '');
        if (value.match(/^0/)) { value = value.substring(1); }
        if (value.length < 2) return;
        
        let dv = value.slice(-1);
        let rut = value.slice(0, -1);
        let formatted = "";
        
        for (let i = rut.length - 1, j = 0; i >= 0; i--, j++) {
            formatted = rut.charAt(i) + (j > 0 && j % 3 === 0 ? "." : "") + formatted;
        }
        if (formatted) { input.value = formatted + "-" + dv; }
    }

    // --- LÓGICA VISTA USUARIO: BUSQUEDA ---
    function buscarMiembro() {
        const rutBuscado = document.getElementById('search-rut').value.trim();
        const resultBox = document.getElementById('search-result');
        
        if (!rutBuscado) {
            alert('Por favor, ingrese un RUT para realizar la consulta.');
            return;
        }

        const db = JSON.parse(localStorage.getItem('miembrosAcademia'));
        const miembroEncontrado = db.find(m => m.rut.trim() === rutBuscado);

        resultBox.style.display = 'block';
        resultBox.classList.remove('error');

        if (miembroEncontrado) {
            resultBox.innerHTML = `
                <h3>¡Acreditación Confirmada!</h3>
                <p>Se certifica que el estudiante es miembro activo de las Academias Científicas de Medicina de la Región del Maule, contando con el respaldo institucional correspondiente.</p>
                <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 15px 0;">
                <p><strong>Nombre Completo:</strong> ${miembroEncontrado.nombre}</p>
                <p><strong>RUT:</strong> ${miembroEncontrado.rut}</p>
                <p><strong>Correo Electrónico:</strong> ${miembroEncontrado.correo}</p>
                <p><strong>Academia Perteneciente:</strong> <span style="color: var(--primary-color); font-weight: bold;">${miembroEncontrado.academia}</span></p>
            `;
        } else {
            resultBox.classList.add('error');
            resultBox.innerHTML = `
                <h3>Miembro No Registrado</h3>
                <p>El RUT <strong>${rutBuscado}</strong> no figura en los registros de membresía vigentes de las academias científicas de la región.</p>
            `;
        }
    }

    // --- LÓGICA VISTA ADMINISTRADOR: CARGA MANUAL ---
    function guardarMiembroManual() {
        const nombre = document.getElementById('manual-nombre').value.trim();
        const rut = document.getElementById('manual-rut').value.trim();
        const correo = document.getElementById('manual-correo').value.trim();
        const academia = document.getElementById('manual-academia').value;

        if (!nombre || !rut || !correo || !academia) {
            alert('Todos los campos son obligatorios para el registro manual.');
            return;
        }

        const db = JSON.parse(localStorage.getItem('miembrosAcademia'));
        
        if (db.some(m => m.rut === rut)) {
            alert('Este RUT ya se encuentra registrado.');
            return;
        }

        db.push({ nombre, rut, correo, academia });
        localStorage.setItem('miembrosAcademia', JSON.stringify(db));

        alert('Miembro guardado exitosamente de forma manual.');
        
        document.getElementById('manual-nombre').value = '';
        document.getElementById('manual-rut').value = '';
        document.getElementById('manual-correo').value = '';
        document.getElementById('manual-academia').value = '';
    }

    // --- LÓGICA VISTA ADMINISTRADOR: CARGA EXCEL (.XLSX) ---
    function cargarExcel() {
        const fileInput = document.getElementById('excel-file');
        const statusDiv = document.getElementById('admin-status');

        if (fileInput.files.length === 0) {
            alert('Por favor, seleccione un archivo .xlsx primero.');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                if (jsonData.length === 0) {
                    alert('El archivo Excel está vacío.');
                    return;
                }

                const db = JSON.parse(localStorage.getItem('miembrosAcademia'));
                let ingresados = 0;
                let duplicados = 0;

                jsonData.forEach(row => {
                    const nombre = row['nombre completo'] || row['Nombre Completo'] || row['nombre'];
                    const rut = row['rut'] || row['RUT'] || row['Rut'];
                    const correo = row['correo'] || row['Correo'] || row['email'] || row['Email'];
                    const academia = row['academia'] || row['Academia'] || row['ACEM'];

                    if (nombre && rut && correo && academia) {
                        if (!db.some(m => m.rut.trim() === String(rut).trim())) {
                            db.push({
                                nombre: String(nombre).trim(),
                                rut: String(rut).trim(),
                                correo: String(correo).trim(),
                                academia: String(academia).trim()
                            });
                            ingresados++;
                        } else {
                            duplicados++;
                        }
                    }
                });

                localStorage.setItem('miembrosAcademia', JSON.stringify(db));
                statusDiv.style.color = 'var(--success-color)';
                statusDiv.innerText = `¡Procesado con éxito! Se añadieron ${ingresados} nuevos miembros. (Duplicados u omitidos: ${duplicados})`;
                fileInput.value = '';

            } catch (error) {
                console.error(error);
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Error al procesar el archivo Excel. Asegúrese de que el formato sea válido.';
            }
        };

        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
